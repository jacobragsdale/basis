name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --locked --all-packages
      - run: uv run pre-commit run --all-files
      - run: uv run pytest

  without-optim:
    # scripts/without_optim.py: nothing outside packages/optim may need it, and its docstring says how this checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv run scripts/without_optim.py

  job-integration:
    # Every member's integration tier, against SQL Server and Oracle.
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Etl-test-1234
        ports: ["1433:1433"]
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: etltest
          APP_USER: etl
          APP_USER_PASSWORD: etltest
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      BASIS_TEST_MSSQL: Server=127.0.0.1,1433;Database=etltest;UID=sa;PWD=Etl-test-1234;Encrypt=yes;TrustServerCertificate=yes
      BASIS_TEST_ORACLE_DSN: 127.0.0.1:1521/FREEPDB1
      BASIS_TEST_ORACLE_USER: etl
      BASIS_TEST_ORACLE_PASSWORD: etltest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --locked --all-packages
      - name: Make the scratch SQL Server database
        run: |
          uv run python - <<'PY'
          import time, mssql_python
          for attempt in range(60):
              try:
                  connection = mssql_python.connect("Server=127.0.0.1,1433;Database=master;UID=sa;PWD=Etl-test-1234;Encrypt=yes;TrustServerCertificate=yes", autocommit=True)
                  break
              except mssql_python.Error:
                  time.sleep(2)
          else:
              raise SystemExit("SQL Server did not start")
          cursor = connection.cursor()
          cursor.execute("IF DB_ID('etltest') IS NULL CREATE DATABASE etltest")
          cursor.execute("ALTER DATABASE etltest SET ALLOW_SNAPSHOT_ISOLATION ON")
          PY
      - run: uv run pytest -m integration

  job-generated-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: Make a job repo from this checkout, with a second job, and run its checks
        run: |
          uv run basis-job new repo pricing-etl --dir "$RUNNER_TEMP" --framework-path .
          cd "$RUNNER_TEMP/pricing-etl"
          uv run basis new job rates
          uv run basis --help
          uv run basis check
      - name: Commit through its hooks, which fix and format the staged files, and refuse a lint error
        working-directory: ${{ runner.temp }}/pricing-etl
        run: |
          test "$(git config core.hooksPath)" = .githooks
          git config user.name ci && git config user.email ci@example.com
          git add --all && git commit --quiet --message "First commit"
          printf 'import os\n\n\ndef total(values: list[int]) -> int:\n    return sum( values )\n' > jobs/rates/totals.py
          git add jobs/rates/totals.py && git commit --quiet --message "A file ruff fixes and formats"
          test "$(git show HEAD:jobs/rates/totals.py)" = "$(printf 'def total(values: list[int]) -> int:\n    return sum(values)')"
          printf 'def total(values):\n    return eval("sum(values)")\n' > jobs/rates/totals.py
          git add jobs/rates/totals.py
          if git commit --quiet --message "A lint error"; then echo "the commit hook let a lint error through" >&2; exit 1; fi
          git reset --quiet --hard
          printf -- '-----BEGIN OPENSSH %s-----\nb3BlbnNzaC1rZXk=\n' 'PRIVATE KEY' > deploy_key  # in pieces, so this file holds none
          git add deploy_key
          if git commit --quiet --message "A private key"; then echo "the commit hook let a private key through" >&2; exit 1; fi
          git rm --quiet --cached deploy_key && rm deploy_key
          uv run basis sync && test -z "$(git status --porcelain)"
      - name: Push through its hook, which checks a commit pushed from a changed tree in a worktree of its own
        working-directory: ${{ runner.temp }}/pricing-etl
        run: |
          git init --quiet --bare "$RUNNER_TEMP/remote.git"
          echo "A change not yet committed." >> README.md
          git push --quiet "$RUNNER_TEMP/remote.git" main
          test "$(git -C "$RUNNER_TEMP/remote.git" rev-parse main)" = "$(git rev-parse HEAD)"
          test "$(git worktree list | wc -l)" = 1 && ! ls -d .git/basis-push* 2>/dev/null
          git checkout --quiet -- README.md
      - name: Leave a Dockerfile of the repo's own alone until it is adopted
        working-directory: ${{ runner.temp }}/pricing-etl
        run: |
          printf 'FROM python:3.14-slim\n' > Dockerfile
          if uv run basis sync; then echo "basis sync overwrote a Dockerfile of the repo's own" >&2; exit 1; fi
          test "$(cat Dockerfile)" = "FROM python:3.14-slim"
          uv run basis sync --adopt
          test "$(cat Dockerfile.before-basis)" = "FROM python:3.14-slim"
          rm Dockerfile.before-basis && test -z "$(git status --porcelain)"

  job-gates:
    # The desktop gates in a generated repo: its push hook runs regress against a local run store, and the QA tier
    # against a SQL Server standing in for QA, and basis review prints both.
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Etl-test-1234
        ports: ["1433:1433"]
    env:
      QA: Server=127.0.0.1,1433;Database=pricing_qa;UID=sa;PWD=Etl-test-1234;Encrypt=yes;TrustServerCertificate=yes
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: Make a job repo from this checkout, and QA's database, with the example's sources, tables and ledger
        run: |
          uv run basis-job new repo pricing-etl --dir "$RUNNER_TEMP" --framework-path .
          cd "$RUNNER_TEMP/pricing-etl"
          git config user.name ci && git config user.email ci@example.com
          uv run basis ddl positions --dialect mssql > "$RUNNER_TEMP/tables.sql"
          uv run basis ddl --ledger etl.publishes --dialect mssql > "$RUNNER_TEMP/ledger.sql"
          uv run python - <<'PY'
          import csv, os, time
          from pathlib import Path
          import mssql_python
          master = os.environ["QA"].replace("Database=pricing_qa", "Database=master")
          for attempt in range(60):
              try:
                  connection = mssql_python.connect(master, autocommit=True)
                  break
              except mssql_python.Error:
                  time.sleep(2)
          else:
              raise SystemExit("SQL Server did not start")
          connection.cursor().execute("CREATE DATABASE pricing_qa")
          connection.cursor().execute("ALTER DATABASE pricing_qa SET ALLOW_SNAPSHOT_ISOLATION ON")
          cursor = mssql_python.connect(os.environ["QA"], autocommit=True).cursor()
          cursor.execute("CREATE TABLE dbo.accounts (account_id varchar(20) PRIMARY KEY, name varchar(100) NOT NULL, closed bit NOT NULL)")
          cursor.execute(
              "CREATE TABLE dbo.trades (trade_id varchar(32) PRIMARY KEY, account_id varchar(20) NOT NULL, security_id varchar(12) NOT NULL,"
              " trade_date date NOT NULL, side varchar(4) NOT NULL, quantity decimal(18,4) NOT NULL, price decimal(18,6) NOT NULL, booked_at datetime2 NOT NULL)"
          )
          for table in ("accounts", "trades"):
              with Path(f"jobs/positions/tests/fixture/{table}.csv").open(encoding="utf-8") as file:
                  header, *rows = list(csv.reader(file))
              marks = ", ".join(f"%(c{index})s" for index in range(len(header)))
              for row in rows:
                  cursor.execute(f"INSERT INTO dbo.{table} VALUES ({marks})", {f"c{index}": {"true": 1, "false": 0}.get(value, value) for index, value in enumerate(row)})
          cursor.execute("CREATE SCHEMA etl")
          for script in ("tables.sql", "ledger.sql"):
              cursor.execute((Path(os.environ["RUNNER_TEMP"]) / script).read_text(encoding="utf-8"))
          PY
      - name: Declare the QA tier, fill in its settings, and publish a run to a local store for regress
        working-directory: ${{ runner.temp }}/pricing-etl
        run: |
          printf '\n[tool.basis.qa]\nsettings = ".env.qa"\nmarker = "qa"\nstores = ["%s/runs-qa"]\nwrites = { warehouse = ["daily_positions", "account_activity", "etl.publishes"] }\n' "$RUNNER_TEMP" >> pyproject.toml
          printf '\n[tool.basis.qa.job]\npositions = { params = "jobs/positions/params/default.json", interval = "2026-11-05..2026-11-06" }\n' >> pyproject.toml
          {
            echo "BASIS_SNAPSHOT_ROOT=$RUNNER_TEMP/runs-qa"
            for name in SOURCE WAREHOUSE; do
              echo "BASIS_DATABASES__${name}__KIND=mssql"
              echo "BASIS_DATABASES__${name}__CONNECTION_STRING='$QA'"
              echo "BASIS_DATABASES__${name}__TIMEOUT_S=60"
              echo "BASIS_DATABASES__${name}__MAX_ROWS=1000"
            done
            echo "BASIS_DATABASES__SOURCE__ISOLATION=snapshot"
            echo "BASIS_DATABASES__WAREHOUSE__ISOLATION=read_committed"
            echo "BASIS_DATABASES__WAREHOUSE__WRITE__CONNECTION_STRING='$QA'"
            echo "BASIS_DATABASES__WAREHOUSE__WRITE__LEDGER=etl.publishes"
          } > .env.qa
          mkdir "$RUNNER_TEMP/store"
          uv run --env-file .env.qa env BASIS_SNAPSHOT_ROOT="$RUNNER_TEMP/store" basis run positions --params jobs/positions/params/default.json --interval 2026-11-05..2026-11-06 --publish
          uv run basis doctor || true  # the runner has no feed; the rest of its lines say what it found
          git add --all && git commit --quiet --message "First commit"
      - name: Push a change through the hook, from a tree with changes of its own, and print what it found
        working-directory: ${{ runner.temp }}/pricing-etl
        run: |
          sed -i 's/.sum().round(2), trades=pl.len())/.sum().round(0), trades=pl.len())/' jobs/positions/job.py
          git add --all && git commit --quiet --message "Round gross notional to whole units"
          echo "A change not yet committed." >> README.md
          git init --quiet --bare "$RUNNER_TEMP/remote.git"
          BASIS_SNAPSHOT_ROOT="$RUNNER_TEMP/store" git push --quiet "$RUNNER_TEMP/remote.git" main 2> "$RUNNER_TEMP/push.log" || { cat "$RUNNER_TEMP/push.log"; exit 1; }
          grep -v '^{' "$RUNNER_TEMP/push.log"
          git checkout --quiet -- README.md
          uv run basis review | tee "$RUNNER_TEMP/review.md"
          grep --quiet "^| positions | \`.*\` | positions: insert: 1 changed (gross_notional 1) |$" "$RUNNER_TEMP/review.md"
          grep --quiet "^| job | positions | \`.*\` | published: account_activity (2 upserted), daily_positions (3 deleted, 3 inserted) |$" "$RUNNER_TEMP/review.md"
          grep --quiet "passed on commit \`$(git rev-parse HEAD)\`" "$RUNNER_TEMP/review.md"
      - name: Refuse QA settings that point outside QA, and run nothing
        working-directory: ${{ runner.temp }}/pricing-etl
        run: |
          sed -i 's/Database=pricing_qa/Database=master/' .env.qa
          if uv run basis check --full 2> "$RUNNER_TEMP/refused.log"; then echo "the QA tier ran against settings outside QA" >&2; exit 1; fi
          grep "^ERROR: " "$RUNNER_TEMP/refused.log"
          grep --quiet "^ERROR: the QA tier ran nothing, for the reasons above" "$RUNNER_TEMP/refused.log"

  job-image:
    # The repo a developer makes with uvx, from this commit on GitHub: its checks, its image, and its example job
    # published from the image to SQL Server.
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Etl-test-1234
        ports: ["1433:1433"]
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SERVER: Server=127.0.0.1,1433;UID=sa;PWD=Etl-test-1234;Encrypt=yes;TrustServerCertificate=yes
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - name: Make a job repo with uvx from this commit, and commit it through its hooks
        run: |
          cd "$RUNNER_TEMP"
          uvx --from "git+https://github.com/${{ github.repository }}@$COMMIT#subdirectory=packages/job" basis-job new repo loads
          cd loads
          grep --quiet "rev = \"$COMMIT\"" pyproject.toml
          uv run basis check
          git config user.name ci && git config user.email ci@example.com
          git add --all && git commit --quiet --message "First commit"
      - name: Build its image
        run: cd "$RUNNER_TEMP/loads" && docker build --tag loads --build-arg GIT_SHA="$(git rev-parse HEAD)" .
      - name: Build it again for another commit, which takes every layer but the last few from the cache
        run: |
          cd "$RUNNER_TEMP/loads"
          docker build --progress=plain --tag loads-again --build-arg GIT_SHA=0123456789abcdef0123456789abcdef01234567 . 2> "$RUNNER_TEMP/again.log"
          python3 - "$RUNNER_TEMP/again.log" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding="utf-8").read()
          steps = dict(re.findall(r"^#(\d+) \[[^\]]+\] (RUN .*)$", log, re.MULTILINE))
          slow = {number: step for number, step in steps.items() if "uv sync" in step or "apt-get install" in step}
          assert len(slow) == 4, slow
          missed = [step for number, step in slow.items() if not re.search(rf"^#{number} CACHED$", log, re.MULTILINE)]
          assert not missed, f"a new commit rebuilt {missed}"
          PY
      - name: Make the database, with the example's sources from its fixture, and its tables and ledger from basis ddl
        run: |
          cd "$RUNNER_TEMP"
          cd loads
          docker run --rm loads ddl positions --dialect mssql > "$RUNNER_TEMP/tables.sql"
          docker run --rm loads ddl --ledger etl.publishes --dialect mssql > "$RUNNER_TEMP/ledger.sql"
          uv run python - <<'PY'
          import csv, os, time
          from pathlib import Path
          import mssql_python
          for attempt in range(60):
              try:
                  connection = mssql_python.connect(os.environ["SERVER"] + ";Database=master", autocommit=True)
                  break
              except mssql_python.Error:
                  time.sleep(2)
          else:
              raise SystemExit("SQL Server did not start")
          connection.cursor().execute("CREATE DATABASE loads")
          connection.cursor().execute("ALTER DATABASE loads SET ALLOW_SNAPSHOT_ISOLATION ON")
          cursor = mssql_python.connect(os.environ["SERVER"] + ";Database=loads", autocommit=True).cursor()
          cursor.execute("CREATE TABLE dbo.accounts (account_id varchar(20) PRIMARY KEY, name varchar(100) NOT NULL, closed bit NOT NULL)")
          cursor.execute(
              "CREATE TABLE dbo.trades (trade_id varchar(32) PRIMARY KEY, account_id varchar(20) NOT NULL, security_id varchar(12) NOT NULL,"
              " trade_date date NOT NULL, side varchar(4) NOT NULL, quantity decimal(18,4) NOT NULL, price decimal(18,6) NOT NULL, booked_at datetime2 NOT NULL)"
          )
          for table in ("accounts", "trades"):
              with Path(f"jobs/positions/tests/fixture/{table}.csv").open(encoding="utf-8") as file:
                  header, *rows = list(csv.reader(file))
              marks = ", ".join(f"%(c{index})s" for index in range(len(header)))
              for row in rows:
                  cursor.execute(f"INSERT INTO dbo.{table} VALUES ({marks})", {f"c{index}": {"true": 1, "false": 0}.get(value, value) for index, value in enumerate(row)})
          cursor.execute("CREATE SCHEMA etl")
          for script in ("tables.sql", "ledger.sql"):
              cursor.execute((Path(os.environ["RUNNER_TEMP"]) / script).read_text(encoding="utf-8"))
          PY
      - name: Run the example job in the image, and publish it
        run: |
          cd "$RUNNER_TEMP"
          mkdir --mode=777 runs
          database="$SERVER;Database=loads"
          docker run --rm --network host --volume "$RUNNER_TEMP/runs:/runs" --env BASIS_SNAPSHOT_ROOT=/runs \
            --env BASIS_DATABASES__SOURCE__KIND=mssql --env "BASIS_DATABASES__SOURCE__CONNECTION_STRING=$database" \
            --env BASIS_DATABASES__SOURCE__ISOLATION=snapshot --env BASIS_DATABASES__SOURCE__TIMEOUT_S=60 --env BASIS_DATABASES__SOURCE__MAX_ROWS=1000 \
            --env BASIS_DATABASES__WAREHOUSE__KIND=mssql --env "BASIS_DATABASES__WAREHOUSE__CONNECTION_STRING=$database" \
            --env BASIS_DATABASES__WAREHOUSE__ISOLATION=read_committed --env BASIS_DATABASES__WAREHOUSE__TIMEOUT_S=60 --env BASIS_DATABASES__WAREHOUSE__MAX_ROWS=1000 \
            --env "BASIS_DATABASES__WAREHOUSE__WRITE__CONNECTION_STRING=$database" --env BASIS_DATABASES__WAREHOUSE__WRITE__LEDGER=etl.publishes \
            loads run positions --params jobs/positions/params/default.json --interval 2026-11-05..2026-11-06 --publish
      - name: Check what it published, and that its run records the image's commit
        run: |
          cd "$RUNNER_TEMP"
          cd loads
          uv run python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import mssql_python
          cursor = mssql_python.connect(os.environ["SERVER"] + ";Database=loads").cursor()
          counts = {}
          for table in ("daily_positions", "account_activity", "etl.publishes"):
              cursor.execute(f"SELECT COUNT(*) FROM {table}")
              counts[table] = cursor.fetchone()[0]
          assert counts == {"daily_positions": 3, "account_activity": 2, "etl.publishes": 2}, counts
          [manifest] = (Path(os.environ["RUNNER_TEMP"]) / "runs/runs/job/positions").glob("*.json")
          run = json.loads(manifest.read_text(encoding="utf-8"))
          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()
          assert (run["status"], run["git_sha"]) == ("published", head), (run["status"], run["git_sha"], head)
          PY
