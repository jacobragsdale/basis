# The basis workspace: every basis package is a member under packages/, and this root is not a package itself. The tool
# settings here apply to every member, but for the settings a member keeps in its own pyproject.toml, such as its own
# ruff settings or import contracts. Nothing here may need a member that basis does not release: CI's without-optim
# leg removes it and runs every check.

[project]
name = "basis-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["basis-api", "basis-core", "basis-job"]  # what basis releases; `uv sync --all-packages` installs every member

[tool.uv]
package = false
required-version = ">=0.13.6"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
basis-api = { workspace = true }
basis-core = { workspace = true }
basis-job = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",  # the example's property-based tests, and what Schemathesis generates its requests with
    "import-linter>=2.16",
    "mutmut>=3.8.1; sys_platform == 'linux'",  # what `basis check --full` tests mutants with, which needs fork: basis.core.mutation
    "pandas-stubs>=3.1.0.261029",  # pandas' types, which ty checks basis-core's and basis-job's frames by in every leg of CI
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff==0.17.4",
    "schemathesis>=4.33.1",  # the requests basis-api's checks send an API on its fakes: basis.api.fuzz
    "ty==0.0.99",
]

[tool.ruff]
line-length = 200
required-version = ">=0.17.4"
force-exclude = true
show-fixes = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]  # Every stable rule; preview rules stay off. Upgrades are deliberate because the version is pinned.
ignore = [
    # Each entry is a rule that cannot be fixed, only turned off. Fix everything else.
    "COM812",  # Conflicts with the formatter; Ruff's docs say to disable it alongside ruff format.
    "ISC001",  # Conflicts with the formatter; Ruff's docs say to disable it alongside ruff format.
    "S603",  # Flags every subprocess call; there is no fix, only review. Pass argv lists, never shell=True (S602).
    "TC001",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "TC002",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "TC003",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "CPY001",  # A copyright header is a legal decision per repository, not a lint fix.
    "D",  # Agents read this code. A required docstring gets written to satisfy the rule; write one only where it says what code and types cannot.
]

[tool.ruff.lint.per-file-ignores]
# pytest's assert is its API, and a test compares against literal expected values. A package's tests/ is not a package,
# and a naive datetime in a test stands for a database's value, in its column's zone.
"**/tests/**" = ["S101", "PLR2004", "INP001", "DTZ001"]
# basis-job's integration tier builds SQL around the scratch tables each test makes and names.
"packages/job/tests/integration/**" = ["S101", "PLR2004", "INP001", "DTZ001", "S608"]
# basis-api's integration tier builds SQL around the scratch tables each test makes and names.
"packages/api/tests/integration/**" = ["S101", "PLR2004", "INP001", "S608"]
"packages/core/tests/integration/**" = ["S101", "PLR2004", "INP001", "S608"]
"**/test_*.py" = ["S101", "PLR2004"]
"**/conftest.py" = ["S101", "PLR2004"]
# A job's hooks share their signatures, so a hook may leave an argument unused.
"packages/job/src/basis/job/example/job.py" = ["ARG001"]
# Statements name tables and columns, which a part's declarations restrict to letters, digits, underscores and $, so
# they can only be built as strings; every value is bound. The rule cannot tell an identifier from a value.
"packages/core/src/basis/core/databases/*.py" = ["S608"]
# The same of the outbox's statements, whose table `api.outbox` restricts as a ledger's name is.
"packages/api/src/basis/api/outboxes.py" = ["S608"]
# A generated repo's files, which `new` copies; they are not part of the package.
"packages/*/src/basis/*/templates/**" = ["INP001"]
# A module the scripts import from their own folder, which Python puts first on sys.path; scripts/ is no package.
"scripts/shared.py" = ["INP001"]

[tool.ruff.lint.isort]
known-first-party = ["basis"]  # every member's portion of the namespace, wherever its src/ is
split-on-trailing-comma = false  # Do not preserve comma-forced import line breaks.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true  # Collapse comma-forced multiline constructs when they fit.

[tool.ty.rules]
all = "error"  # Every rule is an error, including those ty leaves off by default. Opt out one rule at a time, with a reason.

[tool.ty.environment]
# As pytest's `pythonpath`, so basis-job's tests can import `builders`. Their names differ, since ty, like Python,
# resolves a name one way per run. A path that does not exist fails ty, so a member that basis does not release lists
# none here: ty 0.0.99 finds a test's helper module in the test's folder or a folder above it.
extra-paths = ["packages/job/tests", "scripts"]  # and the module the scripts share, which each imports from its own folder

[tool.ty.analysis]
respect-type-ignore-comments = false  # Require a specific `# ty: ignore[rule]` suppression.
strict-generic-narrowing = true  # isinstance on a generic narrows to its top materialization, e.g. list[object].
strict-equality-semantics = true  # Do not narrow from ==, in, or match value patterns; a subclass can compare equal.

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
# importlib mode: members' tests share file names (spike 0.2), which pytest's default mode cannot collect. The
# templates are a generated repo's files, whose tests run in that repo. pytester runs pytest itself, in the throwaway
# repos a member's tests make; a conftest below the root cannot load it. A part's pytest plugin, which its package
# registers for the repos it makes, stays out of this session (`-p no:NAME`), so one part's code never runs in
# another's tests; pytester's own sessions still load it. So does basis-core's, `basis`, which keeps a repo's unit tests
# off sockets: this workspace's own tests serve and reach real servers on sockets, by design, and the example's run
# under it as a repo's do, in the tests of basis-api's checks.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not integration and not heavy' --ignore-glob=packages/*/src/*/templates -p pytester -p no:optim -p no:basis"
testpaths = ["packages/*/tests", "packages/*/src/*/example", "packages/*/src/basis/*/example", "scripts/tests"]  # every member's tests, its example's, and the release script's
pythonpath = ["packages/job/tests", "packages/optim/tests", "scripts"]  # each member's shared test modules, such as basis-job's `builders`, and scripts/release.py; a missing path adds nothing
xfail_strict = true  # An xfail that starts passing is a failure, not a silent pass.
filterwarnings = [
    "error",  # A warning is a defect until someone decides otherwise.
    # Add narrow, dated `ignore::` entries with a reason for third-party
    # deprecations you do not control. Never widen this back to "default".
]
markers = [
    "integration: needs a real SQL Server or Oracle (see packages/job/tests/integration/README.md); excluded from the default run",
    "heavy: runs Schemathesis or mutmut, which stay out of routine runs while the MVP takes shape (`-m heavy` runs them); excluded from the default run",
]

[tool.coverage.run]
branch = true  # Statement coverage hides the untaken half of every condition.
source = ["packages/core/src/basis", "packages/job/src/basis", "packages/api/src/basis", "packages/optim/src/optim"]  # each package's code, not its tests
omit = ["**/templates/**"]  # a generated repo's files, which run in that repo; coverage's `*` stops at a `/`

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
# Deliberately no fail_under: coverage is a diagnostic here, not a CI gate.

# The import contracts of basis-core, basis-job and basis-api. A member with contracts of its own keeps them in its
# pyproject.toml, which the commit hook gives `lint-imports --config`, so these hold without it.
[tool.importlinter]
root_packages = ["basis.core", "basis.job", "basis.api"]  # portions of one namespace, each named (spike 0.2)
include_external_packages = true  # so a contract can forbid a database driver
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "basis-core imports no part: every part builds on it, and none ships with another"
type = "forbidden"
source_modules = ["basis.core"]
forbidden_modules = ["basis.job", "basis.api"]

[[tool.importlinter.contracts]]
name = "Parts import basis-core and never each other, so a change to one cannot break another"
type = "independence"
modules = ["basis.job", "basis.api"]

[[tool.importlinter.contracts]]
name = "basis-core, basis-job and basis-api import no optim, which may change or go"
type = "forbidden"
source_modules = ["basis.core", "basis.job", "basis.api"]
forbidden_modules = ["optim"]  # no root package, so an external one when installed, and a contract that holds when it is not

[[tool.importlinter.contracts]]
name = "Job code and the checks it runs through do no I/O: the run loop loads, saves and publishes"
type = "forbidden"
source_modules = [
    "basis.job.rows", "basis.job.params", "basis.job.inputs", "basis.job.outputs", "basis.job.changes", "basis.job.diff",
    "basis.job.ddl", "basis.job.job", "basis.job.example.job", "basis.job.example.rows",
    "basis.core.interval", "basis.core.tables", "basis.core.destination", "basis.core.model", "basis.core.ddl", "basis.core.frames",
    "basis.core.calendars", "basis.core.display", "basis.core.messages",
]
forbidden_modules = [
    "basis.job.loader", "basis.job.runs", "basis.job.api", "basis.job.cli", "basis.job.new", "basis.job.sync", "basis.job.testing",
    "basis.job.qa",
    "basis.core.databases", "basis.core.publish", "basis.core.runs", "basis.core.snapshots", "basis.core.storage",
    "basis.core.settings", "basis.core.new", "basis.core.sync", "basis.core.testing", "basis.core.command",
    "basis.core.check", "basis.core.verbs", "basis.core.hooks", "basis.core.hygiene", "basis.core.clone", "basis.core.full", "basis.core.invalid",
    "basis.core.gates", "basis.core.mutation", "basis.core.pytest_plugin", "basis.core.qa", "basis.core.review", "basis.core.doctor", "basis.core.upgrade", "basis.core.opened", "basis.core.fakes", "basis.core.traces", "basis.core.sending",
    "mssql_python", "oracledb", "httpx2",
]
ignore_imports = [
    "basis.job -> basis.job.api",  # `etl.run` and `etl.replay` load on first use, which job code never makes
]

[[tool.importlinter.contracts]]
name = "A service's declarations, and the example's, load no server, exporter, database, HTTP client or token verifier: basis builds the app, opens its resources and verifies its users"
type = "forbidden"
source_modules = [
    "basis.api.service", "basis.api.errors", "basis.api.settings", "basis.api.resources", "basis.api.identity", "basis.api.compute", "basis.api.strict",
    "basis.api.dataset", "basis.api.origins", "basis.api.example.service", "basis.api.example.handlers", "basis.api.example.repository",
    "basis.api.example.resources", "basis.api.example.errors", "basis.api.example.domain",
]
forbidden_modules = [
    "basis.api.app", "basis.api.requests", "basis.api.server", "basis.api.cli", "basis.api.sync", "basis.api.opened",
    "basis.api.fakes", "basis.api.routes", "basis.api.pool", "basis.api.call", "basis.api.dev", "basis.api.tokens", "basis.api.outboxes", "basis.api.relay",
    "jwt", "cryptography", "uvicorn",
    "basis.api.openapi", "basis.api.contract", "basis.api.arrow", "basis.api.layers", "basis.api.fuzz", "grimp", "schemathesis", "hypothesis",
    "basis.core.databases", "basis.core.publish", "basis.core.runs", "basis.core.snapshots", "basis.core.command", "basis.core.check", "basis.core.hooks",
    "basis.core.hygiene", "basis.core.sync", "basis.core.opened", "basis.core.fakes", "basis.core.traces", "basis.core.gates", "basis.core.mutation",
    "basis.core.pytest_plugin", "mssql_python", "oracledb", "httpx", "httpx2", "requests", "urllib3", "aiohttp",
]
ignore_imports = [
    "basis.api -> basis.api.app",  # `api.build` loads on first use, which a service's modules never make
    "basis.api -> basis.api.server",  # as does `api.serve`, and `api.serve_on_fakes`
    "basis.api -> basis.api.call",  # as does `api.call_route`
]

[[tool.importlinter.contracts]]
name = "Compute modules do no I/O and reach no resource: the process pool gives each function values, and it returns one"
type = "forbidden"
source_modules = ["basis.api.example.compute"]
forbidden_modules = [
    "basis.api.app", "basis.api.call", "basis.api.cli", "basis.api.compute", "basis.api.deadlines", "basis.api.dev", "basis.api.errors", "basis.api.fakes",
    "basis.api.identity", "basis.api.opened", "basis.api.outboxes", "basis.api.pool", "basis.api.relay", "basis.api.requests", "basis.api.resources", "basis.api.routes", "basis.api.server",
    "basis.api.service", "basis.api.settings", "basis.api.strict", "basis.api.sync", "basis.api.tokens", "basis.api.example.service",
    "basis.api.example.handlers", "basis.api.example.repository", "basis.api.example.resources", "basis.api.example.errors", "basis.api.example.dev", "basis.api.dataset", "basis.api.arrow", "basis.api.origins", "basis.api.openapi", "basis.api.contract", "basis.api.layers", "basis.api.fuzz", "basis.core",
    "fastapi", "starlette", "uvicorn", "pydantic_settings", "mssql_python", "oracledb", "httpx", "httpx2", "requests", "urllib3", "aiohttp",
]
