# The basis workspace: every basis package is a member under packages/, and this root is not a package itself. The tool
# settings here apply to every member.

[project]
name = "basis-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["basis-core", "basis-job"]

[tool.uv]
package = false
required-version = ">=0.13.6"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
basis-core = { workspace = true }
basis-job = { workspace = true }

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff==0.17.4",
    "ty==0.0.99",
]

[tool.ruff]
line-length = 200
required-version = ">=0.17.4"
force-exclude = true
show-fixes = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]  # Every stable rule; preview rules stay off. Upgrades are deliberate because the version is pinned.
ignore = [
    # Each entry is a rule that cannot be fixed, only turned off. Fix everything else.
    "COM812",  # Conflicts with the formatter; Ruff's docs say to disable it alongside ruff format.
    "ISC001",  # Conflicts with the formatter; Ruff's docs say to disable it alongside ruff format.
    "S603",  # Flags every subprocess call; there is no fix, only review. Pass argv lists, never shell=True (S602).
    "TC001",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "TC002",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "TC003",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "CPY001",  # A copyright header is a legal decision per repository, not a lint fix.
    "D",  # Agents read this code. A required docstring gets written to satisfy the rule; write one only where it says what code and types cannot.
]

[tool.ruff.lint.per-file-ignores]
# pytest's assert is its API, and a test compares against literal expected values. A package's tests/ is not a package,
# and a naive datetime in a test stands for a database's value, in its column's zone.
"**/tests/**" = ["S101", "PLR2004", "INP001", "DTZ001"]
# basis-job's integration tier builds SQL around the scratch tables each test makes and names.
"packages/job/tests/integration/**" = ["S101", "PLR2004", "INP001", "DTZ001", "S608"]
"**/test_*.py" = ["S101", "PLR2004"]
"**/conftest.py" = ["S101", "PLR2004"]
# A job's hooks share their signatures, so a hook may leave an argument unused.
"packages/job/src/basis/job/example/job.py" = ["ARG001"]
# Statements name tables and columns, which a part's declarations restrict to letters, digits, underscores and $, so
# they can only be built as strings; every value is bound. The rule cannot tell an identifier from a value.
"packages/core/src/basis/core/databases/*.py" = ["S608"]
# A generated repo's files, which `new` copies; they are not part of the package.
"packages/*/src/basis/*/templates/**" = ["INP001"]

[tool.ruff.lint.isort]
known-first-party = ["basis"]  # every member's portion of the namespace, wherever its src/ is
split-on-trailing-comma = false  # Do not preserve comma-forced import line breaks.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true  # Collapse comma-forced multiline constructs when they fit.

[tool.ty.rules]
all = "error"  # Every rule is an error, including those ty leaves off by default. Opt out one rule at a time, with a reason.

[tool.ty.environment]
extra-paths = ["packages/job/tests"]  # as pytest's `pythonpath`, so basis-job's tests can import `builders`

[tool.ty.analysis]
respect-type-ignore-comments = false  # Require a specific `# ty: ignore[rule]` suppression.
strict-generic-narrowing = true  # isinstance on a generic narrows to its top materialization, e.g. list[object].
strict-equality-semantics = true  # Do not narrow from ==, in, or match value patterns; a subclass can compare equal.

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
# importlib mode: members' tests share file names (spike 0.2), which pytest's default mode cannot collect. The
# templates are a generated repo's files, whose tests run in that repo.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not integration' --ignore=packages/job/src/basis/job/templates"
testpaths = ["packages/core/tests", "packages/job/tests", "packages/job/src/basis/job/example"]
pythonpath = ["packages/job/tests"]  # basis-job's test modules share its `builders`
xfail_strict = true  # An xfail that starts passing is a failure, not a silent pass.
filterwarnings = [
    "error",  # A warning is a defect until someone decides otherwise.
    # Add narrow, dated `ignore::` entries with a reason for third-party
    # deprecations you do not control. Never widen this back to "default".
]
markers = [
    "integration: needs a real SQL Server or Oracle (see packages/job/tests/integration/README.md); excluded from the default run",
]

[tool.coverage.run]
branch = true  # Statement coverage hides the untaken half of every condition.
source = ["packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
# Deliberately no fail_under: coverage is a diagnostic here, not a CI gate.

# The import contracts, for every member.
[tool.importlinter]
root_packages = ["basis.core", "basis.job"]  # portions of one namespace, each named (spike 0.2)
include_external_packages = true  # so a contract can forbid a database driver
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "basis-core imports no part: every part builds on it, and none ships with another"
type = "forbidden"
source_modules = ["basis.core"]
forbidden_modules = ["basis.job"]

[[tool.importlinter.contracts]]
name = "Job code and the checks it runs through do no I/O: the run loop loads, saves and publishes"
type = "forbidden"
source_modules = [
    "basis.job.rows", "basis.job.params", "basis.job.inputs", "basis.job.outputs", "basis.job.changes", "basis.job.diff",
    "basis.job.ddl", "basis.job.job", "basis.job.example.job", "basis.job.example.rows",
    "basis.core.interval", "basis.core.tables", "basis.core.destination", "basis.core.model",
]
forbidden_modules = [
    "basis.job.loader", "basis.job.runs", "basis.job.api", "basis.job.cli", "basis.job.new", "basis.job.sync", "basis.job.testing",
    "basis.core.databases", "basis.core.publish", "basis.core.runs", "basis.core.snapshots", "basis.core.storage",
    "basis.core.settings", "basis.core.new", "basis.core.sync", "basis.core.testing", "mssql_python", "oracledb",
]
ignore_imports = [
    "basis.job -> basis.job.api",  # `etl.run` and `etl.replay` load on first use, which job code never makes
]
