repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7   # keep in sync with the uv version CI uses
    hooks:
      - id: uv-lock   # fails the commit if a pyproject.toml changed without uv.lock


  - repo: local
    hooks:
      - id: ty   # ty-pre-commit's hook found no Python files at this virtual workspace root and checked nothing
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: lint-imports   # the import contracts in pyproject.toml
        name: lint-imports
        entry: uv run lint-imports --no-cache   # no .import_linter_cache folder; the graph builds fresh each run
        language: system
        types: [python]
        pass_filenames: false
