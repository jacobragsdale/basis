repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7   # keep in sync with the uv version CI uses
    hooks:
      - id: uv-lock   # fails the commit if a pyproject.toml changed without uv.lock

  - repo: local
    hooks:
      - id: untracked   # --all-files checks what git tracks alone: a new file not yet added would pass it, and fail the commit
        name: untracked files
        entry: uv run python scripts/untracked.py
        language: system
        files: ^\.pre-commit-config\.yaml$   # always among --all-files' files, and a commit's only when it changes the hooks
        pass_filenames: false
      - id: ruff-check   # the workspace's ruff, which its dev group pins, rather than a mirror's second pin of it
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: dead-code   # every function, class, method and property nothing uses, which ruff does not see
        name: dead code
        entry: uv run python scripts/dead_code.py
        language: system
        types: [python]
        pass_filenames: false
      - id: release-check   # every member at the root's one version, pinning basis-core at it, and saying whether a release publishes it
        name: release check
        entry: uv run scripts/release.py check
        language: system
        files: (^|/)pyproject\.toml$|^uv\.lock$|^scripts/release\.py$
        pass_filenames: false

      - id: ty   # ty-pre-commit's hook found no Python files at this virtual workspace root and checked nothing
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        always_run: true   # a commit that only deletes a file, or changes ty's settings, can break another file
        require_serial: true

      - id: lint-imports   # the import contracts in pyproject.toml
        name: lint-imports
        entry: uv run lint-imports --no-cache   # no .import_linter_cache folder; the graph builds fresh each run
        language: system
        types: [python]
        pass_filenames: false
