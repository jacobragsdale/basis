# Sort imports as a job repo does, where basis is a third-party package and the job's own modules, here
# basis.job.example, are first-party. `basis new job` leaves this file out of the jobs it copies.
extend = "../../../../../../pyproject.toml"

[lint.isort]
known-first-party = ["basis.job.example"]
known-third-party = ["basis"]
split-on-trailing-comma = false

[lint]
# A generated repo's ruff selects PLR0913, which the workspace's ignores, and the example is copied into one.
extend-select = ["PLR0913"]
