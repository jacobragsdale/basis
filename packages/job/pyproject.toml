[project]
name = "basis-job"
version = "0.0.0"
description = "The run loop that ETL jobs share: typed inputs and outputs, a pure transform, checks before any write, all-or-nothing publishing to SQL Server and Oracle, and snapshots that replay"
readme = "README.md"
authors = [{ name = "Jacob Ragsdale", email = "jacobragsdale@pm.me" }]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "basis-core==0.0.0",  # every basis package depends on basis-core at exactly its own version
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.1",
    "tzdata>=2025.2; sys_platform == 'win32'",  # zoneinfo has no time zone database of its own on Windows
]

[project.scripts]
basis-job = "basis.job.cli:scaffold"  # `uvx basis-job new repo NAME` makes a job repo

[project.entry-points."basis.verbs"]
job = "basis.job.cli:part"  # basis-job's verbs, in a repo whose [tool.basis] parts include "job"

[tool.uv.sources]
basis-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "basis.job"
