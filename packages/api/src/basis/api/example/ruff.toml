# Sort imports as a service repo does, where basis is a third-party package and the service's own modules, here
# basis.api.example, are first-party.
extend = "../../../../../../pyproject.toml"

[lint.isort]
known-first-party = ["basis.api.example"]
known-third-party = ["basis"]
split-on-trailing-comma = false

[lint]
# A generated repo's ruff selects PLR0913, which the workspace's ignores, and the example is copied into one.
extend-select = ["PLR0913"]
