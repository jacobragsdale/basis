[project]
name = "basis-api"
version = "0.1.0"
description = "HTTP APIs on FastAPI: a service declares its routes and settings, and basis builds the same app around them in every repo"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "basis-core[serve]==0.1.0",  # every basis package depends on basis-core at exactly its own version, which brings httpx2 and OpenTelemetry, and its server, uvicorn on Starlette
    "cryptography>=50.0.2",  # the public keys a token verifies with, read from PEM
    "fastapi>=0.162.0",
    "pyarrow>=26.0.1",  # a dataset route's Arrow stream, as basis-core's snapshots already hold it: see basis.api.arrow
    "pyjwt[crypto]>=2.15.1",  # verifies bearer tokens: see basis.api.tokens
]

[project.optional-dependencies]
dev = ["basis-core[dev]", "hypothesis>=6.170.0", "schemathesis>=4.33.1"]  # what a repo's dev group takes, as basis-api[dev]: basis-core's tools, at the versions basis checks with, and the fuzz's

[project.scripts]
basis-api = "basis.api.cli:scaffold"  # `uvx basis-api new app NAME` makes an API repo, with a job beside it

[project.entry-points."basis.verbs"]
api = "basis.api.cli:part"  # basis-api's verbs, in a repo whose [tool.basis] parts include "api"

[tool.uv.sources]
basis-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "basis.api"

[tool.basis-release]
publish = true  # a basis release publishes this package, at the one version every member has
