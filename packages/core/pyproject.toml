[project]
name = "basis-core"
version = "0.0.0"
description = "The plumbing every basis part shares. Internal: repos depend on a part, which brings this with it."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "grimp>=3.19",
    "httpx2>=2.16.0",  # the client of the services a part calls, and the transport of their fakes: see basis.core.opened
    "mssql-python>=1.17.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-common>=1.45.2",  # OTLP's encoding of spans, which basis.core.traces posts itself
    "opentelemetry-sdk>=1.45.2",
    "oracledb>=26.1.0",
    "pandas>=3.1.1",  # the frames a part hands code, each column Arrow-backed: see basis.core.frames
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",  # `basis check --staged` parses each staged YAML file
    "tzdata>=2025.2; sys_platform == 'win32'",  # zoneinfo has no time zone database of its own on Windows
]

[project.optional-dependencies]
excel = [  # basis.core.folders reads and writes workbooks with pandas, through these engines alone: a repo that does takes basis-core[excel]
    "python-calamine>=0.9.1",  # read_excel's fastest engine, Rust's calamine, which reads .xlsx, .xlsm, .xlsb and .xls
    "xlsxwriter>=3.3.1",  # to_excel's engine for .xlsx
]

mongo = [  # basis.core.mongo reads and upserts documents through it: a repo that does takes basis-core[mongo]
    "pymongo>=4.19.0",
]

[project.scripts]
basis = "basis.core.command:main"  # every part's verbs, through the basis.verbs entry points

[project.entry-points.pytest11]
basis = "basis.core.pytest_plugin"  # every repo's tests: no sockets in unit tests, and what basis check reads of them (basis.core.gates)

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "basis.core"

[tool.basis-release]
publish = true  # a basis release publishes this package, at the one version every member has
