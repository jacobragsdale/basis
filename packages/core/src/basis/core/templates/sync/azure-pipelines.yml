# This file is managed by basis: `basis sync` rewrites it from the installed version, and `basis check` fails when it differs.
# The deploy pipeline: check the commit, then build the repo's one image and push it, tagged with the commit.
#
# STUB. The steps that install uv, reach the internal feed, and build, push and deploy the image are the maintainer's
# team's pipeline templates, which basis does not know yet; spike 0.1 supplies them, and a basis release replaces each
# value marked STUB below. Until then, register no pipeline from this file. Pull requests are checked on the desktop,
# by the hooks in .githooks/; the day the firm builds CI, a branch policy on main that requires this pipeline makes
# its check stage the gate.

trigger:
  branches:
    include: [main]

resources:
  repositories:
    - repository: templates
      type: git
      name: STUB-project/STUB-pipeline-templates  # STUB: the team's templates repository
      ref: refs/heads/main

variables:
  image: $(Build.Repository.Name)

stages:
  - stage: check
    displayName: basis check --full
    jobs:
      - job: check
        pool:
          vmImage: ubuntu-latest  # STUB: the team's agent pool
        steps:
          # The whole history: Azure Pipelines fetches one commit by default, which has no parent and no merge base,
          # and check --full compares the change with where it branched, or its parent, to mutate only what it touched.
          - checkout: self
            fetchDepth: 0
          - script: curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh  # STUB: uv as the team's agents get it
            displayName: Install uv
          - script: |
              export PATH="$HOME/.local/bin:$PATH"
              uv sync --locked
              uv run --locked basis check --full
            displayName: basis check --full
            # STUB: an internal index needs its credentials here, as the team's templates provide them

  - stage: image
    displayName: Build and push the image
    dependsOn: check
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: image
        pool:
          vmImage: ubuntu-latest  # STUB: the team's agent pool
        steps:
          - checkout: self
          - template: STUB-build-and-push.yml@templates  # STUB: the team's template that builds and pushes an image
            parameters:
              dockerfile: Dockerfile
              repository: $(image)
              tags: $(Build.SourceVersion)
              arguments: --build-arg GIT_SHA=$(Build.SourceVersion)

  - stage: release
    displayName: Release the image to dev, through the deploy repository
    dependsOn: image
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: release
        pool:
          vmImage: ubuntu-latest  # STUB: the team's agent pool
        steps:
          # STUB: the team's template that opens the deploy repository's release pull request for the image the image
          # stage pushed, by its commit tag and digest, such as berth's `berth release APP --env dev --version
          # $(Build.SourceVersion)@sha256:DIGEST` and `berth pr`, as its release bot. Promotion to QA and prod is a
          # pull request there too, reviewed by its owners.
          - script: echo "STUB, release $(image) at $(Build.SourceVersion) to dev"
            displayName: Open the release pull request

# `basis smoke --env qa --commit COMMIT` checks QA once it serves the commit: its document is the committed one, it
# is ready and running COMMIT, and each route's read-only example answers. It runs after the deploy repository has
# deployed the commit to QA, so the deploy pipeline triggers it, and its failure blocks the promotion to prod:
#
#   - script: |
#       uv sync --locked
#       uv run --locked basis smoke --env qa --commit "$COMMIT"
#     env:
#       BASIS_ENV: qa  # STUB: QA's settings, BASIS_SMOKE__URL among them, as the team's variable groups give them
#       COMMIT: STUB   # the commit QA was deployed with, as the deploy pipeline passes it
