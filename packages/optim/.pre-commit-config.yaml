repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7   # keep in sync with the uv version the repo is built with
    hooks:
      - id: uv-lock   # fails the commit if pyproject.toml changed without uv.lock

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.89   # keep in sync with the pinned ty dev dependency
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: lint-imports   # the import contracts in pyproject.toml: prep, rules and the solve do no I/O
        name: lint-imports
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
