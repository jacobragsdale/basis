[project]
name = "optim"
version = "0.1.0"
description = "The run loop that quants' portfolio models share: loading, parallelism, rounding, acceptance, snapshots and replay"
readme = "README.md"
authors = [{ name = "Jacob Ragsdale", email = "jacobragsdale@protonmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "basis-core==0.1.0",  # every basis package depends on basis-core at exactly its own version
    "cvxpy>=1.9.3",
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "packaging>=26.3",  # a version's parts, as `optim new repo` reads them
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.scripts]
optim = "optim.cli:main"  # `basis` under its earlier name, and `uvx optim new repo NAME MODEL`, which makes a model repo

[project.entry-points."basis.verbs"]
optim = "optim.cli:part"  # optim's verbs, in a repo whose [tool.basis] parts include "optim"

[project.entry-points.pytest11]
optim = "optim.pytest_plugin"

[project.optional-dependencies]
copt = ["coptpy>=8.0.7"]  # the licensed COPT solver; tests run it size-limited, without a license

[dependency-groups]
# What ty needs to check optim from the workspace's root, where `uv sync --all-packages` installs it: the COPT solver its
# reader imports, and the stubs of pandas and scipy.
dev = ["coptpy>=8.0.7", "pandas-stubs>=3.0.5.260914", "scipy-stubs>=1.18.1.1"]

[tool.uv.sources]
basis-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "optim"

# Kept at the one version every member has, which its exact basis-core pin needs, and built and checked, but no release
# publishes optim while its design may change.
[tool.basis-release]
publish = false

[tool.ruff]
line-length = 200
required-version = ">=0.17.1"
force-exclude = true  # pre-commit passes file names; still honour excludes
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]  # every rule; opt out below, with a reason
ignore = [
    "D",  # module docstrings are prose, not pydocstyle sections
    "CPY",  # no copyright headers
    "COM812",  # conflicts with the formatter
    "TC",  # annotations are lazy on 3.14, and pydantic needs its types at runtime
    "PLR2004",  # 0.5, 1e-6 and friends read better inline than as constants
    "PLR0913",  # keyword-only arguments are clearer than a parameter object
    "FBT003",  # stdlib calls such as `captureWarnings(True)` take positional booleans
    "TD003", "FIX002",  # `TODO(port)` marks where a port writes code; there is no issue to link
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]  # pytest asserts; tests/ is not a package
"tests/integration/**" = ["S101", "INP001", "S608"]  # builds SQL around the scratch table each test makes and names
"src/optim/example/tests/**" = ["S101"]  # the example's tests, which each model's tests/ gets
"src/optim/example/{model.py,rules/**}" = ["ARG001"]  # hooks and rules share their signatures, so most leave an argument unused
"src/optim/templates/**" = ["INP001"]  # a model repo's files, which the generator copies

[tool.ruff.lint.isort]
known-first-party = ["basis"]  # basis-core, which this workspace builds beside optim, sorts with optim's own imports
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

# optim's import contracts, apart from the workspace root's so that those hold with optim gone. From the root, the commit
# hook runs them as `uv run lint-imports --no-cache --config packages/optim/pyproject.toml`. That no other part imports
# optim is the root's contract, which the hook runs on any change to them.
[tool.importlinter]
root_packages = ["optim", "basis.core", "basis.job", "basis.api"]  # basis's are portions of one namespace, each named
include_external_packages = true  # so a contract can forbid a database driver
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "optim imports basis-core and no other part, so a change to one cannot break another"
type = "forbidden"
source_modules = ["optim"]
forbidden_modules = ["basis.job", "basis.api"]

# With basis-core's I/O forbidden beside optim's own, since optim's plumbing became basis-core's (roadmap step 3.3).
[[tool.importlinter.contracts]]
name = "Model code and what workers run do no I/O: the parent loads and saves"
type = "forbidden"
source_modules = [
    "optim.contract", "optim.cvxpy", "optim.models", "optim.decide", "optim.engine", "optim.acceptance", "optim.datasets",
    "optim.example.model", "optim.data.dataset", "optim.data.frames", "optim.schema",
]
forbidden_modules = [
    "optim.data.loader", "optim.data.cache", "optim.sources.database", "optim.sources.rest", "optim.sources.file",
    "optim.context", "optim.settings", "optim.snapshots", "optim.runs", "optim.api", "optim.orders", "optim.research",
    "optim.cli", "basis.core.databases", "basis.core.publish", "basis.core.runs", "basis.core.snapshots", "basis.core.storage",
    "basis.core.settings", "basis.core.new", "basis.core.sync", "basis.core.testing", "basis.core.command",
    "basis.core.check", "basis.core.verbs", "basis.core.hooks", "basis.core.hygiene", "httpx", "oracledb", "mssql_python",
    "pyarrow",
]
ignore_imports = ["optim -> optim.api"]  # `optim.run` and friends load on first use, which model code never makes
